<style>
  :root{
    --red:#e02424; --green:#16803c; --blue:#2563eb; --orange:#f97316;
    --bg:#f3f4f6; --card:#fff; --text:#1f2937; --muted:#6b7280; --line:#e5e7eb;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text)}
  header{display:flex;align-items:center;gap:12px;padding:12px 18px;margin:12px 12px 0;
    background:linear-gradient(135deg,#b91c1c,#e02424);color:#fff;border-radius:12px;flex-wrap:wrap}
  header h1{font-size:19px;font-weight:700;letter-spacing:.5px}
  header .sub{font-size:12px;opacity:.9}
  header .spacer{flex:1}
  .hbtn{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.45);color:#fff;
    padding:7px 16px;border-radius:8px;cursor:pointer;font-size:13px}

  @media(max-width:980px){#app{grid-template-columns:1fr}}

  .card{background:var(--card);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:14px}

  .ctrl{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:8px}
  .ctrl label{color:var(--muted)}
  .ctrl input[type=number]{width:64px;padding:5px;border:1px solid var(--line);border-radius:6px;text-align:center}
  .ok{color:var(--green);font-size:12px} .bad{color:var(--red);font-size:12px}
  .status{font-size:12px;margin-top:4px;line-height:1.5}
  .kv{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px;margin-top:6px}
  .kv b{color:var(--text)}
  .trend{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .chi{font-size:11px;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;padding:3px 8px;border-radius:999px}
  .sect{display:flex;justify-content:space-between;margin-bottom:2px;font-size:12px}
  .sect .n{color:var(--red);font-weight:700}
  .group{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
  .group .ghead{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .ghead .t-red{color:var(--red)} .ghead .t-blue{color:var(--blue)} .ghead .t-orange{color:var(--orange)}
  .tagc{font-size:11px;background:#fee2e2;color:#b91c1c;padding:2px 8px;border-radius:999px}
  .tagc.blue{background:#dbeafe;color:#1d4ed8}
  .tagc.orange{background:#ffedd5;color:#c2410c}
  .picks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:620px){.picks{grid-template-columns:1fr}}
  .pick{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;position:relative}
  .pick .rk{position:absolute;top:8px;right:10px;font-size:22px;font-weight:800;color:#e5e7eb}
  .pick .top{display:flex;align-items:baseline;gap:8px}
  .pick .nm{font-size:14px;font-weight:700}
  .pick .cd{font-size:11px;color:var(--muted)}
  .pick .pr{font-size:15px;font-weight:700;margin-left:auto}
  .up{color:var(--red)} .down{color:var(--green)}
  .bestrows{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:11px}
  .br{background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:4px 8px;text-align:center}
  .br .k{color:var(--muted);font-size:10px} .br .v{font-weight:700}
  .risk{margin-top:8px}
  .rtag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:5px;margin-right:6px;margin-top:3px;font-weight:600}
  .rtag.warn{background:#fff7ed;color:#c2410c;border:1px solid #fdba74}
  .rtag.danger{background:#fee2e2;color:#b91c1c;border:1px solid #fecaca}
  .rtag.ok{background:#dcfce7;color:#15803d;border:1px solid #bbf7d0}
  .why{font-size:11.5px;color:#374151;line-height:1.7;margin-top:8px;border-top:1px dashed var(--line);padding-top:7px}
  .why b{color:#7f1d1d}
  #loading{display:none;text-align:center;padding:14px;color:var(--muted);font-size:13px}
  .bar{position:relative;height:4px;background:#eee;border-radius:3px;overflow:hidden;margin-top:8px}
  .bar i{position:absolute;left:0;top:0;bottom:0;width:30%;background:#e02424;animation:ln 1s infinite}
  @keyframes ln{from{left:-30%}to{left:100%}}
  .note{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.6}
  .empty{font-size:12px;color:var(--muted);padding:8px}

<div class="modal" id="helpModal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:50;align-items:center;justify-content:center"></div>

<script>
/* ================== 工具 ================== */
const $=s=>document.querySelector(s);
const fmtB=(v)=>{const b=v/1e8; return b>=100?b.toFixed(1):b>=10?b.toFixed(2):b.toFixed(2)+'';};
const fmtW=(v)=>typeof v==='number'?v.toFixed(2):'-';
const isMainBoard=(code)=>/^(600|601|603|605|000|001|002)\d{3}$/.test(code); // 排除 300/301 创业板、688/689 科创板、8xx/4xx 北交所

/* JSONP 加载器（绕过 CORS） */
function jsonp(url, key='cb', timeout=15000){
  return new Promise((resolve,reject)=>{
    const cb='cb'+Math.random().toString(36).slice(2,10);
    const s=document.createElement('script');
    let done=false;
    const t=setTimeout(()=>{cleanup();reject(new Error('超时: '+url));},timeout);
    function cleanup(){if(!done){done=true;clearTimeout(t);delete window[cb];if(s.parentNode)s.remove();}}
    window[cb]=(d)=>{cleanup();resolve(d);};
    s.onerror=()=>{cleanup();reject(new Error('加载失败: '+url));};
    s.src=url+'&'+key+'='+cb;
    document.head.appendChild(s);
  });
}
/* fetch 带重试（用于腾讯K线） */
async function fetchJson(url, tries=2){
  for(let i=0;i<tries;i++){
    try{const r=await fetch(url);if(!r.ok)throw 0;return await r.json();}catch(e){if(i===tries-1)throw e;await new Promise(r=>setTimeout(r,600));}
  }
}
/* 并发限流的任务池 */
async function poolRange(start, end, conc, fn){
  let idx=start; const out=[];
  const worker=async()=>{for(;;){const i=idx++;if(i>end)break;const r=await fn(i);out[i-start]=r;}};
  await Promise.all(Array.from({length:conc},worker));
  return out;
}

/* ================== 数据源 ================== */
const SINA_BASE='https://vip.stock.finance.sina.com.cn/quotes_service/api/json_v2.php/Market_Center.getHQNodeData';
// 新浪返回纯 JSON 且带 CORS（Access-Control-Allow-Origin:*），用 fetch 解析
async function fetchSinaAll(){
  const pages=[];
  const res=await poolRange(1, 72, 8, async(pg)=>{
    try{const r=await fetchJson(`${SINA_BASE}?page=${pg}&num=100&sort=changepercent&asc=0&node=hs_a&symbol=&_s_r_a=p${pg}`);return Array.isArray(r)?r:false;}
    catch(e){return false;}
  });
  for(const arr of res){if(Array.isArray(arr))pages.push(...arr);}
  const map=new Map();
  for(const q of pages){ if(!q||!q.code)continue; if(!isMainBoard(q.code))continue; map.set(q.code,Object.assign({},q,{trade:+q.trade||0,changepercent:+q.changepercent||0,turnoverratio:+q.turnoverratio||0,amount:+q.amount||0,nmc:+q.nmc||0})); }
  return Array.from(map.values());
}

async function findTradingDay(){
  const d=new Date(); const tries=[];
  for(let i=0;i<12;i++){const t=new Date(d.getTime()-i*86400000); tries.push(`${t.getFullYear()}${String(t.getMonth()+1).padStart(2,'0')}${String(t.getDate()).padStart(2,'0')}`);}
  const EM='https://push2ex.eastmoney.com/getTopicZTPool?ut=7eea3edcaed734bea9cbfc24409ed989&dpt=wz.ztzt&Pageindex=0&pagesize=400&sort=fbt%3Aasc&date=';
  for(const date of tries){
    try{const d=await jsonp(EM+date,'cb',10000); if(d&&d.data&&Array.isArray(d.data.pool))return {date, pool:d.data.pool};}
    catch(e){}
  }
  return {date:null,pool:[]};
}

function mt(code){return /^6\d{5}$/.test(code)?'sh':'sz';}
async function fetchKlines(codes){
  const out={};
  await poolRange(0, Math.max(0,codes.length-1), 7, async(i)=>{
    const c=codes[i];
    try{
      const ssym = mt(c)+c;
      const j=await fetchJson(`https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=${ssym},day,,,12,qfq`,2);
      const raw=(j&&j.data&&j.data[ssym])?(j.data[ssym]['qfqday']||j.data[ssym].day||null):null;
      if(raw&&raw.length){
        out[c]=raw.map(r=>({d:r[0],o:+r[1],c:+r[2],h:+r[3],l:+r[4],v:+r[5]}));
      }
    }catch(e){}
  });
  return out;
}
async function fetchMainFlow(codes){ // 东方财富资金流日K，末行为主力净流入
  const out={};
  await poolRange(0, Math.max(0,codes.length-1), 8, async(i)=>{
    const c=codes[i];
    try{
      const mkt=/^6\d{5}$/.test(c)?1:0;
      const j=await fetchJson(`https://push2.eastmoney.com/api/qt/stock/fflow/daykline/get?klt=101&secid=${mkt}.${c}&fields1=f1,f2,f3,f7&fields2=f51,f52,f53,f54,f55,f56,f57`,2);
      const ks=(j&&j.data&&j.data.klines)||[];
      if(ks.length){const last=ks[ks.length-1].split(','); out[c]=+last[1];} // 主力净流入(元)
    }catch(e){}
  });
  return out;
}
function klineMetrics(kl){
  if(!kl||kl.length<6)return null;
  const last=kl[kl.length-1];
  const closes=kl.map(k=>k.c);
  const ma=(n)=>{const s=closes.slice(-n);return s.reduce((a,b)=>a+b,0)/n;};
  const ma5=ma(5),ma10=ma(10);
  const prev5=kl.slice(-6,-1).map(k=>k.v);
  const avg5=prev5.reduce((a,b)=>a+b,0)/prev5.length||1;
  const vr=last.v/avg5;
  const idx5=Math.max(0,closes.length-6);
  const chg5=(last.c/closes[idx5]-1)*100;
  let lbc=0; const lim=n=>n;
  for(let i=kl.length-1;i>0;i--){
    const r=(kl[i].c/kl[i-1].c-1)*100;
    if(r>=9.7){lbc++;}else if(r>=-9.7){break;}else{break;}
  }
  return {price:last.c, vr, ma5, ma10, chg5, lbc, vol:last.v,
    broke5:last.c<ma5, broke10:last.c<ma10};
}

/* ================== 策略引擎（鹤老大模式） ================== */
function detectLimitPct(name){return /ST/i.test(name)?5:10;}

function buildLimitPicks(stocks, ztPoolMap, klines, flows, n){ // 打板推荐（首板优先）
  const arr=[];
  for(const s of stocks){
    const limit=detectLimitPct(s.name);
    if(!(s.changepercent>=limit*0.95))continue;
    arr.push(s);
  }
  // 合并涨停池详情
  for(const s of arr){
    const z=ztPoolMap.get(s.code);
    s.lbc=z?z.lbc:(klines[s.code]?klines[s.code].lbc:1);
    s.fund=z?z.fund:0; s.zbc=z?z.zbc:0; s.hybk=z?z.hybk:''; s.ltsz=z?z.ltsz:(s.nmc*1e4);
    s.hs=s.turnoverratio;
  }
  // 板块热度（同一行业涨停家数）
  const hyCount={};
  arr.forEach(s=>{if(s.hybk){hyCount[s.hybk]=(hyCount[s.hybk]||0)+1;}});
  const maxHy=Math.max(1,...Object.values(hyCount));
  flows=flows||{};
  const score=(s)=>{
    const lbc=+s.lbc||1; const fund=+s.fund||0; const hs=+s.hs||0;
    const ltsz=+s.ltsz||1e10; const zbc=+s.zbc||0;
    const flow=flows[s.code]||0;
    const hyBoost=hyCount[s.hybk]?hyCount[s.hybk]/maxHy:0;
    let sc=0;
    sc+=lbc<=1?30:Math.max(0,12-lbc*4);        // 首板优先，多板接力递减
    sc+=Math.log10(fund+1)/9*22;               // 封单金额（封板质量，回测：次日再涨停率26%vs基线15%）
    sc+=Math.min(hs/25,1)*12;                  // 适度换手（人气）
    sc+=Math.max(0,1-Math.log10(ltsz)/9.7)*13; // 小市值弹性
    sc+=hyBoost*11;                            // 板块助力
    if(flow>0)sc+=Math.min(flow/5e8,1)*8;       // 主力净流入（资金认同）
    sc-=Math.min(zbc,5)*3;                     // 炸板惩罚
    if(hs<1.5&&lbc>=3)sc-=6;                   // 一字板/低换手高标风险
    return {sc, lbc};
  };
  const scaled=arr.map(s=>({s,sc:score(s).sc,lbc:+s.lbc||1}));
  scaled.sort((a,b)=>b.sc-a.sc);
  // 首板优先：先取首板，不足再用多板连股补齐
  const first=scaled.filter(x=>x.lbc<=1);
  const rest=scaled.filter(x=>x.lbc>1);
  return [...first,...rest].slice(0,n).map(x=>x.s).filter(Boolean);
}

function buildTrendPicks(cands, klines, flows, n){ // 非涨停 → 当天会大涨（强势拉升）
  const arr=cands;
  flows=flows||{};
  const score=(s)=>{
    const km=klines[s.code];
    const vr=km?km.vr:1;
    const hs=+s.turnoverratio||0;
    const amount=+s.amount||0;
    const nmc=+s.nmc||0; // 万元
    const flow=flows[s.code]||0;
    const chg=+s.changepercent||0; // 当日当前涨幅（核心：当天大涨）
    const lim=detectLimitPct(s.name);
    let sc=0;
    sc+=Math.min(Math.max(chg,0)/(lim*0.9),1)*20;  // 当前涨幅（回测：纯追当日涨幅易回撤，降权）
    sc+=Math.min(Math.log10(vr+1)/1.1,1)*26;       // 当日放量确认（量能，课程31/32）
    sc+=Math.min(hs/20,1)*14;                      // 换手人气
    sc+=Math.log10(amount+1)/12.5*9;               // 成交额资金参与
    sc+=Math.max(0,1-Math.log10(nmc*1e4)/10)*8;    // 小流通市值弹性（低吸）
    if(flow>0)sc+=Math.min(flow/5e8,1)*10;         // 主力净流入
    if(km)sc+=Math.min(Math.max(km.chg5,0),30)/30*18; // 5日动量（回测：低开+强动量更易拿≥7%，加码）
    if(km&&km.chg5>45)sc-=15;                      // 短期涨幅过陡追高惩罚
    if(vr<1)sc-=6;                                 // 未放量降权
    if(chg<0)sc-=15;                               // 走弱降权
    return sc;
  };
  const scaled=arr.map(s=>({s,sc:score(s)}));
  scaled.sort((a,b)=>b.sc-a.sc);
  return scaled.slice(0,n).map(x=>x.s).filter(Boolean);
}
function prelimTrendScore(s){ // 初选排序：换手+成交额+小市值+涨幅位置（不依赖K线）
  return Math.min((+s.turnoverratio||0)/15,1)*40
        +Math.log10((+s.amount||0)+1)/12.5*30
        +Math.max(0,1-Math.log10((+s.nmc||0)*1e4)/10)*20
        +Math.min(s.changepercent/9,1)*10;
}

function sectorHeat(pickStocks, n){ // 从涨停池统计热门板块
  const c={}; pickStocks.forEach(s=>{if(s.hybk){c[s.hybk]=c[s.hybk]||0;c[s.hybk]++;}});
  return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,n);
}

/* 竞价·可能涨停：结合集合竞价高开强度 + 市场情绪，推荐2只最可能冲击涨停的主板票 */
function buildAuctionPicks(cands, klines, flows, hotSector, sentiment, n){
  flows=flows||{};
  if(!(hotSector instanceof Set))hotSector=new Set();
  const score=(s)=>{
    const km=klines[s.code]; const flow=flows[s.code]||0;
    const lim=detectLimitPct(s.name);
    const cp=+s.changepercent||0;
    const openGap=(+s.open&&+s.settlement)?((+s.open/+s.settlement-1)*100):0; // 集合竞价高开%
    const vr=km?km.vr:0;
    const hot=hotSector.has(s.hybk);
    let sc=0;
    sc+=Math.max(0,Math.min(cp,lim)/lim)*32;         // 越接近涨停越可能封板（首要信号）
    sc+=(openGap>=3&&openGap<=7)?12:openGap>0&&openGap<3?(openGap/3)*7:(openGap>7&&openGap<9)?16-(openGap-7)*2:0; // 竞价高开（回测：高开≥3%仅占涨停样本27%，弱前提，降权）
    sc+=(vr>=1.5&&vr<=3)?20:(vr>3)?11:(vr*8);            // 量比（回测：放量更贴近封板资金）
    if(flow>0)sc+=Math.min(flow/5e8,1)*12;            // 主力净流入
    if(hot)sc+=10;                                     // 热门板块加分
    sc+=sentiment*8;                                   // 市场情绪加成
    if(cp<4)sc-=12;                                    // 距涨停太远，概率低
    return {sc, openGap, vr, cp};
  };
  const scaled=cands.map(s=>({s,ev:score(s)}));
  scaled.sort((a,b)=>b.ev.sc-a.ev.sc);
  return scaled.slice(0,Math.min(n,cands.length)).map(x=>x.s);
}
function auctionCard(p, rank, km){
  const pct=p.changepercent.toFixed(2);
  const up=p.changepercent>=0;
  const openGap=(+p.open&&+p.settlement)?((+p.open/+p.settlement-1)*100).toFixed(1):'-';
  const vr=km?km.vr:NaN;
  const name=p.name.replace('N','N·').replace('C','C·');
  const niche=`今日涨<b>${pct}%</b>、竞价高开<b>${openGap}%</b>，处于冲击涨停强势区；`;
  return `<div class="pick">
    <div class="rk">${rank}</div>
    <div class="top"><span class="nm">${name}</span><span class="cd">${p.code}</span>
      <span class="pr ${up?'up':'down'}">${p.trade} ${up?'+':''}${pct}%</span></div>
    <div class="bestrows">
      <div class="br"><div class="k">竞价高开</div><div class="v">${openGap}%</div></div>
      <div class="br"><div class="k">现涨幅</div><div class="v">${pct}%</div></div>
      ${km?`<div class="br"><div class="k">量比</div><div class="v">${fmtW(vr)}</div></div>`:''}
      <div class="br"><div class="k">主力净流入</div><div class="v" style="color:${p.flow>0?'var(--red)':p.flow<0?'var(--green)':'var(--text)'}">${p.flow?fmtB(p.flow)+'亿':'—'}</div></div>
      <div class="br"><div class="k">换手率</div><div class="v">${fmtW(+p.turnoverratio)}%</div></div>
      ${p.hybk?`<div class="br"><div class="k">板块</div><div class="v">${p.hybk}</div></div>`:''}
    </div>
    <div class="why">${niche}集合竞价高开+量能放大+主力${p.flow>0?'净流入':'动向待验'}，配合市场情绪乘数锁定涨停概率（课程22/31/32 人气·资金）。<br><span style="color:#991b1b">⚠ 竞价/情绪推演仅供研究，非投资建议。</span></div>
  </div>`;
}

/* ================== 渲染 ================== */
function pickCard(p, rank, isLimit, km){
  const limit=detectLimitPct(p.name);
  const pct=p.changepercent.toFixed(2);
  const up=p.changepercent>=0;
  const zt=isLimit;
  const lbc=+p.lbc||1;
  const risks=[];
  if(zt&&lbc>=6)risks.push({t:'高连板风险',c:'danger'});
  if(zt&&(+p.zbc||0)>1)risks.push({t:'曾多次炸板',c:'warn'});
  if(/ST/.test(p.name))risks.push({t:'ST风险警示',c:'danger'});
  if(km&&km.broke10)risks.push({t:'已破10日线·按纪律离场',c:'warn'});
  if(zt&&(+p.hs||0)<1.5&&lbc>=3)risks.push({t:'一字/缩量封板·谨防断板接盘',c:'warn'});
  const name=p.name.replace('N','N·').replace('C','C·');
  // 依据文本
  const parts=[];
  if(zt){
    if(lbc<=1)parts.push(`<b>模式要点·首板：</b>该股今日<b>首次涨停（首板）</b>，首板空间+人气兼具，适合打板优选；`);
    else parts.push(`<b>模式要点·接力（非首板）：</b>该股已连板${lbc}天，明日分歧/断板风险加大，仅次优补足；`);
    if(p.fund)parts.push(`封单约${fmtW_b(p.fund)}亿，封板较${p.fund>2e8?'坚实':'一般'}（课程03 封单质量）；`);
    if(p.flow)parts.push(`今日主力净流入${fmtB(p.flow)}亿，${p.flow>0?'资金进场认同涨停级别':'主力净流出需警惕'}；`);
    if(p.hybk)parts.push(`所属<b>${p.hybk}</b>板块出现涨停梯队，板块合力强；`);
    parts.push(`换手${fmtW(+p.hs)}%、流通市值${fmtW_b(p.ltsz)}亿，${(+p.hs||0)>25?'分歧偏大注意承接':'人气较健康'}。`);
  }else{
    const vr=km?km.vr:NaN;
    parts.push(`<b>模式要点·当天大涨：</b>今日现涨${pct}% 强势拉升、未涨停，有望当日继续冲高；`);
    if(km&&isFinite(vr))parts.push(`量比${fmtW(vr)}、${vr>=1.5?'明显放量，资金进场（课程31/32 跟随资金）':'量能一般'}；`);
    parts.push(`换手${fmtW(+p.turnoverratio)}%、成交${fmtW_b(p.amount)}亿，人气与资金为${(+p.turnoverratio||0)>6?'活跃':'中上'}；`);
    if(p.flow){parts.push(`今日主力净流入${fmtB(p.flow)}亿，${p.flow>0?'主力加仓，跟随资金（课程31/32）':'主力净流出，谨慎接力'}；`);}
    if(km){parts.push(`5日涨幅${fmtW(km.chg5)}%，均线${km.broke10?'已破10日〈风险〉':'位于MA5/MA10上方〈多头〉'}（主板破10日线止损·指南）；`);}
    parts.push(`流通市值${fmtW_b(p.nmc*1e4)}亿，弹性较好。`);
  }
  return `<div class="pick">
    <div class="rk">${rank}</div>
    <div class="top"><span class="nm">${name}</span><span class="cd">${p.code}</span>
      <span class="pr ${up?'up':'down'}">${p.trade} ${up?'+':''}${pct}%</span></div>
    <div class="bestrows">
      <div class="br"><div class="k">${zt?'状态':'涨跌幅'}</div><div class="v">${zt?(lbc<=1?'首板':lbc+'板'):pct+'%'}</div></div>
      ${zt?`<div class="br"><div class="k">封单(亿)</div><div class="v">${fmtW_b(p.fund)}</div></div>`:''}
      <div class="br"><div class="k">换手率</div><div class="v">${fmtW(+p.turnoverratio)}%</div></div>
      ${km?`<div class="br"><div class="k">量比</div><div class="v">${fmtW(km.vr)}</div></div>`:''}
      <div class="br"><div class="k">主力净流入</div><div class="v" style="color:${p.flow>0?'var(--red)':p.flow<0?'var(--green)':'var(--text)'}">${p.flow?fmtB(p.flow)+'亿':'—'}</div></div>
      <div class="br"><div class="k">流通市值</div><div class="v">${fmtW_b(p.ltsz||p.nmc*1e4)}亿</div></div>
      ${p.hybk?`<div class="br"><div class="k">板块</div><div class="v">${p.hybk}</div></div>`:''}
    </div>
    ${risks.length?`<div class="risk">${risks.map(r=>`<span class="rtag ${r.c}">${r.t}</span>`).join('')}</div>`:''}
    <div class="why">${parts.join('')}</div>
  </div>`;
}
const fmtW_b=(v)=>(typeof v==='number'&&isFinite(v))?(v/1e8).toFixed(2):'-';

/* ================== 主流程 ================== */
let timer=null;
function setStatus(t,c){const el=$('#status');el.innerHTML=t;el.className='status '+c;}
function running(on){$('#loading').style.display=on?'block':'none';$('#bar').style.display=on?'block':'none';}

async function run(){
  running(true);
  setStatus('正在连接数据源…','');
  const nLimit=Math.min(6,Math.max(1,+$('#nLimit').value||4));
  const nTrend=Math.min(6,Math.max(1,+$('#nTrend').value||3));
  const src=[];
  let meta={};
  try{
    // 1) 快照
    let stocks=[];
    try{
      stocks=await fetchSinaAll();
      meta.sina=true; src.push('<li><span class="ok">✓</span> 新浪 · 全市场快照 <b>'+stocks.length+'</b> 只主板</li>');
    }catch(e){src.push('<li><span class="bad">✗</span> 新浪快照失败：'+e.message+'</li>');}
    if(!stocks.length) throw new Error('未获取到行情快照');
    setStatus('已获取快照 '+stocks.length+' 只，正在获取涨停池…','ok');

    // 2) 涨停池（连板/封单/板块）
    let ztPool=[], date=null, ztSector=new Set();
    try{
      const r=await findTradingDay();
      ztPool=r.pool; date=r.date;
      ztPool.forEach(z=>{if(isMainBoard(z.c)){ztSector.add(z.hybk);}});
      src.push('<li><span class="ok">✓</span> 东方财富涨停池 <b>'+ztPool.length+'</b> 只（'+date+'）</li>');
    }catch(e){src.push('<li><span class="bad">✗</span> 涨停池失败：'+e.message+'</li>');}
    const ztMap=new Map(ztPool.filter(z=>isMainBoard(z.c)).map(z=>[z.c,z]));

    // 3) 候选K线（连板\|量比\|均线）
    setStatus('正在计算量能/均线指标…','ok');
    const limitCands=stocks.filter(s=>s.changepercent>=detectLimitPct(s.name)*0.95).slice(0,24).map(s=>s.code);
    const trendShort=stocks.filter(s=>s.changepercent>=1.5&&s.changepercent<detectLimitPct(s.name)-0.8)
      .map(s=>({s,sc:prelimTrendScore(s)}))
      .sort((a,b)=>b.sc-a.sc).slice(0,40).map(x=>x.s);
    const trendCands=trendShort.map(s=>s.code);
    // 竞价·可能涨停候选：强势非涨停（距涨停近、开盘高开），用于“竞价可能涨停”版块
    const auctionCands=stocks.filter(s=>{const l=detectLimitPct(s.name); return s.changepercent>=4&&s.changepercent<l;})
      .sort((a,b)=>b.changepercent-a.changepercent).slice(0,20);
    const kNeed=Array.from(new Set([...limitCands,...trendCands,...auctionCands.map(s=>s.code)]));
    const klines=await fetchKlines(kNeed);
    const kc=Object.keys(klines).length;
    src.push('<li><span class="ok">✓</span> 腾讯K线 <b>'+kc+'</b> 条（量比/均线/连板）</li>');

    // 3.5) 主力净流入（东方财富资金流·仅取高分候选，降低请求量防限流）
    setStatus('正在拉取主力资金流…','');
    const flowCands=Array.from(new Set([...limitCands, ...trendShort.slice(0,14).map(s=>s.code), ...auctionCands.slice(0,14).map(s=>s.code)])).slice(0,34);
    const flows=await fetchMainFlow(flowCands);
    const nf=Object.keys(flows).length;
    if(nf<10){
      src.push('<li><span class="bad">⚠</span> 主力净流入接口当前受限（'+nf+'/'+flowCands.length+'），数值显示“—”，自动刷新将重试</li>');
    }else{
      src.push('<li><span class="ok">✓</span> 东方财富资金流 <b>'+nf+'</b> 只（主力净流入）</li>');
    }

    // 4) 选股
    const limitPicks=buildLimitPicks(stocks, ztMap, klines, flows, nLimit);
    const trendPicks=buildTrendPicks(trendShort, klines, flows, nTrend);
    // 市场情绪：涨停家数 + 红盘占比 → 0.2~1
    const _ztCnt=stocks.filter(s=>s.changepercent>=detectLimitPct(s.name)*0.95-0.01).length;
    const _upR=stocks.length?stocks.filter(s=>s.changepercent>0).length/stocks.length:0;
    const sentiment=Math.min(1,Math.max(0.2,_ztCnt/60*0.5+_upR*0.5));
    const auctionPicks=buildAuctionPicks(auctionCands, klines, flows, ztSector, sentiment, 2);
    [...limitPicks,...trendPicks,...auctionPicks].forEach(p=>{const f=flows[p.code]; if(f)p.flow=f;});

    // 5) 市场概览
    const m=$('#ov');
    const upCount=stocks.filter(s=>s.changepercent>0).length;
    const dnCount=stocks.filter(s=>s.changepercent<0).length;
    const ztCount=stocks.filter(s=>s.changepercent>=detectLimitPct(s.name)*0.95-0.01).length;
    const maxLbc=Math.max(0,...limitPicks.map(p=>+p.lbc||0));
    const hot=sectorHeat(limitPicks,5);

    $("#gTrend").style.display='block';
    const settleTime=stocks[0]?.ticktime||'-';
    $('#datatime').innerHTML='数据时间：'+settleTime+(/^\d{2}:\d{2}:\d{2}$/.test(settleTime)?'（最近交易日收盘/盘中）':'');
    m.innerHTML=`<div class="sect"><span>主板红盘家数</span><span class="n">${upCount}</span></div>
      <div class="sect"><span>主板绿盘家数</span><span class="n" style="color:var(--green)">${dnCount}</span></div>
      <div class="sect"><span>主板涨停家数</span><span class="n">${ztCount}</span></div>
      <div class="sect"><span>命中最高连板</span><span class="n">${limitPicks.length?maxLbc+' 板':'—'}</span></div>
      <div class="note">情绪强弱：${ztCount>=60?'极强':ztCount>=30?'强':ztCount>=15?'中等':'弱'} · 涨跌比 ${ztCount>0&&dnCount>0?(upCount/dnCount).toFixed(1)+':1':'—'}</div>`;
    if(hot.length){m.insertAdjacentHTML('beforeend','<div class="trend">'+hot.map(([k])=>`<span class="chi">${k}</span>`).join('')+'</div><div class="note">热门概念板块（含涨停梯队）</div>');}

    // 6) 渲染
    $('#cLimit').textContent=limitPicks.length+' / '+nLimit;
    $('#pLimit').innerHTML=limitPicks.length?limitPicks.map((p,i)=>pickCard(p,i+1,true,klines[p.code])).join(''):'<div class="empty">今日无符合条件的打板主板票</div>';
    $('#cTrend').textContent=trendPicks.length+' / '+nTrend;
    $('#pTrend').innerHTML=trendPicks.length?trendPicks.map((p,i)=>pickCard(p,i+1,false,klines[p.code])).join(''):'<div class="empty">暂无当日强势大涨票</div>';
    $('#cAuction').textContent=auctionPicks.length+' / 2';
    $('#pAuction').innerHTML=auctionPicks.length?auctionPicks.map((p,i)=>auctionCard(p,i+1,klines[p.code])).join(''):'<div class="empty">暂无符合条件的竞价冲板票</div>';
    $('#why').innerHTML=guideText();
    $('#src').innerHTML='<ul style="list-style:none;line-height:1.9">'+src.join('')+'</ul>';

    setStatus(`完成 · 打板<b>${limitPicks.length}</b> + 当日大涨<b>${trendPicks.length}</b> + 竞价冲板<b>${auctionPicks.length}</b>，合计≤12。`,'ok');
  }catch(e){
    setStatus('执行失败：'+e.message,'bad');
    $('#src').innerHTML='<ul style="list-style:none;line-height:1.9">'+src.join('')+'</ul>';
  }finally{
    running(false);
  }
}

function guideText(){
  return `<div style="font-size:12.5px;line-height:1.9;color:#374151">
    <p><b>选股范围：</b>严格 A股<b>主板</b>（600/601/603/605 沪主板，000/001/002 深主板），<b>已排除</b> 科创板(688/689)、创业板(300/301)、北交所(8xx/4xx/92x)。涨停识别按主板涨跌幅限制（ST=5%、普通=10%）。</p>
    <p><b>构成：</b>本次选股 = <b>${$('#nLimit').value||3}只打板推荐</b>（首板优先，不足连板补）+ <b>${$('#nTrend').value||3}只当日大涨</b>（强势拉升，非涨停），另有<b>2只竞价可能涨停</b>，总数 ≤7。</p>
    <p><b>基础上游法则（本教程/指南）：</b></p>
    <ul style="margin-left:18px;list-style:disc">

      <li><b>人气为王</b>：人气带来溢价（JPG《横盘的内在逻辑》），量+人气是核心、跟随资金（课程22/31/32）。</li>
      <li><b>封单与换手成本</b>：封单越扎实越稳、警惕高换手分歧与一字板断板接盘（课程03/16；JPG《一字连板断板后千万不要追》）。</li>
      <li><b>有逻辑的票</b>：基本面逻辑（如成本革命→利润释放）驱动主升浪（课程26；DOCX《短剧逻辑之于化工》）。</li>
      <li><b>风控纪律</b>：主板股<b>破10日线离场</b>、情绪看涨跌家数/最高连板/热门板块；轻仓保盈亏比。</li>
    </ul>
    <p style="color:#991b1b"><b>风险提示：</b>以下结果由实时行情与规则自动推演生成，仅供研究参考，<b>不构成任何投资建议</b>。市场有风险，追高/接盘风险需自行控制。</p>
  </div>`;
}

/* 事件 */
$('#btnRun')?.addEventListener('click',run);
$('#btnRun2')?.addEventListener('click',run);
$('#auto')?.addEventListener('change',(e)=>{
  if(timer)clearInterval(timer);
  const mins=+e.target.value;
  if(mins>0){timer=setInterval(run,mins*60000); setStatus('自动刷新：每'+mins+'分钟','');}
});
$('#btnHelp')?.addEventListener('click',()=>runHelp());
function runHelp(){
  const m=$('#helpModal');
  m.style.display='flex';m.innerHTML=`<div style="background:#fff;border-radius:12px;max-width:760px;width:92%;max-height:86vh;overflow:auto;padding:24px;position:relative">
    <button style="position:absolute;top:12px;right:12px;padding:4px 12px;border:none;border-radius:6px;cursor:pointer;background:#e5e7eb" onclick="document.getElementById('helpModal').style.display='none'">关闭</button>
    ${guideText()}</div>`;
}
run();
